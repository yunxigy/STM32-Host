# STM32 上位机：共享服务器部署用的 Nginx 片段。
#
# 只有 location，没有 server 块，供站点统一入口 include：
#     include /etc/nginx/snippets/stm32-host.conf;
#
# 单独部署整台服务器时请用 nginx-stm32-host.conf（含完整 server 块），
# 两个文件不要同时生效，否则会出现重复 location。
#
# 前端构建 base 为 /stm32v2/，页面发布到 /var/www/stm32-host/stm32v2。

location = /stm32v2 {
    return 301 /stm32v2/;
}

# 后台 API 与 WebSocket。WS 必须显式转发 Upgrade。
location ^~ /stm32v2/api/ {
    proxy_pass http://127.0.0.1:8007/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
}

# 构建产物带 hash，缺失就是真缺失，不要回落到 index.html。
location ^~ /stm32v2/assets/ {
    root /var/www/stm32-host;
    try_files $uri =404;
}

location /stm32v2/ {
    root /var/www/stm32-host;
    try_files $uri $uri/ /stm32v2/index.html;
}
