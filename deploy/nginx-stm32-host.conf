# The installer substitutes your-domain.example with the supplied IP/domain.
server {
    listen 80;
    server_name your-domain.example;
    root /var/www/stm32-host;
    index index.html;
    access_log /var/log/stm32-host/nginx-access.log;
    error_log /var/log/stm32-host/nginx-error.log;

    location = / {
        return 302 /stm32v2/;
    }

    location ^~ /stm32v2/api/ {
        proxy_pass http://127.0.0.1:8007/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location = /stm32v2 {
        return 301 /stm32v2/;
    }

    location ^~ /stm32v2/assets/ {
        try_files $uri =404;
    }

    location /stm32v2/ {
        try_files $uri $uri/ /stm32v2/index.html;
    }
}
